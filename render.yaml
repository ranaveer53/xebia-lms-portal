services:
  - type: web
    name: xebia-lms-backend
    image:
      url: ghcr.io/ranaveer53/xebia-lms-backend:latest
      # GitHub Container Registry credentials (stored as Render environment group)
      creds:
        fromRegistryCredentialId: ghcr-credentials
    plan: free
    healthCheckPath: /api/actuator/health
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://xebia-lms-portal-three.vercel.app
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx384m -Xms128m
      - key: MONGODB_URI
        sync: false
